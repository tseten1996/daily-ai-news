name: Check sitemap freshness

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sitemap.xml matches the generator
        run: ./scripts/check-sitemap.sh
